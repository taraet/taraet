# tara-daily-snake
# hiiii im totally working everyday haha, and i just love snake because my chinese zodiac is snake
name: Generate Snake Animation

on:
  schedule:
    - cron: '0 1 * * *'   # once a day, 08:00 WIB (UTC+7) = 01:00 UTC
  workflow_dispatch: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game from contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: taraet
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

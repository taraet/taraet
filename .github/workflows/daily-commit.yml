name: Daily Streak Keeper

on:
  schedule:
    # Runs every day at 08:00 WIB (UTC+7) = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch: {}   # lets you trigger it manually too, for testing

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update last-synced timestamp
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s|<sub>last synced:.*</sub>|<sub>last synced: ${TIMESTAMP}</sub>|" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: daily sync ($(date -u +%Y-%m-%d))"
          git push
